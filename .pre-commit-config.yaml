# Installé via `uv run pre-commit install`. Lancé à chaque commit, et en CI (brique 8).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # tolère les tags custom (ex. !reference)
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]  # les données vont sur S3, pas dans Git
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch  # filet local : on ne commite pas sur main
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
